name: Asta quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-quality:
    name: Python and database quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        # Reviewed multi-platform index: PostgreSQL 18.6 and pgvector 0.8.6.
        image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: asta_app
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: asta_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asta_app -d asta_test_db"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://asta_app:ci-only-ephemeral@127.0.0.1:5432/asta_test_db
      TEST_DATABASE_URL: postgresql+psycopg://asta_app:ci-only-ephemeral@127.0.0.1:5432/asta_test_db
      ALEMBIC_DATABASE_URL: postgresql+psycopg://asta_app:ci-only-ephemeral@127.0.0.1:5432/asta_test_db
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      GROQ_API_KEY: ''
      GROQ_MODEL: openai/gpt-oss-120b
      LLM_TEMPERATURE: '0.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-ci.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints-ci.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Repository and environment safety
        run: python -m scripts.check_repository_safety
      - name: Python syntax
        run: python -m compileall -q app scripts tests migrations
      - name: Actual application startup without external connections
        run: python -m scripts.check_startup
      - name: Prepare isolated CI schema
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U asta_app -d asta_test_db -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector;'
          python -m alembic upgrade head
      - name: Full Python suite including deterministic evaluation and database integration
        run: |
          mkdir -p .cache
          python -m pytest -q -p no:cacheprovider --basetemp=.cache/ci-tmp
  node-quality:
    name: JavaScript quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: JavaScript syntax
        run: |
          for file in frontend/js/*.js frontend/js/*.mjs; do node --check "$file"; done
      - name: All widget and integration tests
        run: node --test frontend/tests/*.test.mjs
