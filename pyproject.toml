[project]
name = "asta-webportal-ai"
version = "0.1.0"
description = "Enterprise AI knowledge assistant for A&A Engineering WebPortal."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]